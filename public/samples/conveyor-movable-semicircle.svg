<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fbfbf9"/>
  <text x="32" y="44" font-family="sans-serif" font-size="20" fill="#1c1c1c">传送带加速 · 冲上可平动半圆槽</text>
  <text x="32" y="74" font-family="sans-serif" font-size="14" fill="#555550">滑块 m = 0.2 kg 从长 1.6 m、倾角 30° 的光滑斜面顶端由静止下滑，经光滑转向进入</text>
  <text x="32" y="98" font-family="sans-serif" font-size="14" fill="#555550">以 5 m/s 运行的传送带（μ = 0.25），再滑上质量 M = 1.8 kg、半径 R = 0.36 m 的</text>
  <text x="32" y="122" font-family="sans-serif" font-size="14" fill="#555550">可平动光滑半圆槽。槽与地面均光滑，g = 10 m/s²。求滑块离开槽时槽的速度。</text>
  <line x1="48" y1="290" x2="600" y2="290" stroke="#1c1c1c" stroke-width="2"/>
  <path d="M60 290 L130 214 L200 290" fill="none" stroke="#1c1c1c" stroke-width="2"/>
  <text x="128" y="208" font-family="sans-serif" font-size="12" fill="#1c1c1c">P</text>
  <text x="196" y="306" font-family="sans-serif" font-size="12" fill="#1c1c1c">B</text>
  <text x="96" y="262" font-family="sans-serif" font-size="12" fill="#555550">1.6 m</text>
  <text x="150" y="282" font-family="sans-serif" font-size="12" fill="#555550">30°</text>
  <rect x="204" y="252" width="150" height="16" fill="#e8e8e3" stroke="#1c1c1c" stroke-width="2"/>
  <circle cx="212" cy="260" r="8" fill="none" stroke="#1c1c1c" stroke-width="2"/>
  <circle cx="346" cy="260" r="8" fill="none" stroke="#1c1c1c" stroke-width="2"/>
  <line x1="240" y1="244" x2="292" y2="244" stroke="#2f6b3f" stroke-width="2"/>
  <path d="M292 244 l-9 -4 v8 z" fill="#2f6b3f"/>
  <text x="236" y="236" font-family="sans-serif" font-size="12" fill="#2f6b3f">v带 = 5 m/s</text>
  <text x="228" y="292" font-family="sans-serif" font-size="12" fill="#555550">μ = 0.25</text>
  <path d="M380 290 A 62 62 0 0 1 504 290" fill="none" stroke="#1c1c1c" stroke-width="2.5"/>
  <line x1="442" y1="290" x2="442" y2="228" stroke="#8e8e88" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="448" y="252" font-family="sans-serif" font-size="12" fill="#555550">R = 0.36 m</text>
  <rect x="372" y="290" width="140" height="10" fill="#c9d8ea" stroke="#1c1c1c" stroke-width="1.5"/>
  <text x="392" y="322" font-family="sans-serif" font-size="12" fill="#1c1c1c">M = 1.8 kg（可平动）</text>
  <text x="374" y="342" font-family="sans-serif" font-size="12" fill="#8a4b4b">槽与地面均光滑：水平方向动量守恒</text>
</svg>
