<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#ffffff"/>
  <style>
    .t { font-family: "SimSun", "Songti SC", "PingFang SC", "Microsoft YaHei", serif; fill: #1a1a1a; font-size: 21px; }
    .lbl { font-family: "Times New Roman", Georgia, serif; font-style: italic; fill: #1a1a1a; font-size: 20px; }
    .sub { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill: #333333; font-size: 15.5px; }
  </style>

  <!-- 题干文字 -->
  <text x="52" y="54" class="t">3. 如图所示，足够长的水平传送带在 t = 0 时刻以初速度 v₀ = 2 m/s 向右运行，同时将一</text>
  <text x="52" y="90" class="t">   小滑块由静止轻放在传送带左端。0 ~ 3 s 内传送带以 a₁ = 1 m/s² 匀加速运动；3 ~ 4 s</text>
  <text x="52" y="126" class="t">   内传送带加速度突增为 a₂ = 3 m/s²。已知滑块与带面间的动摩擦因数 μk = 0.20，最大静</text>
  <text x="52" y="162" class="t">   摩擦因数 μs = 0.25，重力加速度 g 取 10 m/s²。求：</text>

  <!-- 左图：传送带示意图 -->
  <g transform="translate(55, 205)">
    <!-- 传送带外廓 -->
    <rect x="20" y="72" width="460" height="36" rx="18" fill="#f5f5f2" stroke="#1a1a1a" stroke-width="2.4"/>
    <circle cx="38" cy="90" r="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="462" cy="90" r="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="38" cy="90" r="2.5" fill="#1a1a1a"/>
    <circle cx="462" cy="90" r="2.5" fill="#1a1a1a"/>

    <!-- 滑块 -->
    <rect x="78" y="38" width="38" height="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
    <text x="97" y="61" text-anchor="middle" class="lbl">m</text>
    <text x="97" y="26" text-anchor="middle" class="sub">v块0 = 0</text>

    <!-- 传送带运行方向箭头 -->
    <line x1="210" y1="48" x2="310" y2="48" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="316,48 304,43 304,53" fill="#1a1a1a"/>
    <text x="262" y="36" text-anchor="middle" class="sub">v带0 = 2 m/s，向右加速</text>

    <!-- 摩擦标注 -->
    <text x="250" y="138" text-anchor="middle" class="sub">μk = 0.20，μs = 0.25（a静max = 2.5 m/s²）</text>
  </g>

  <!-- 右图：传送带 v带 - t 图像 -->
  <g transform="translate(595, 198)">
    <!-- 坐标轴 -->
    <line x1="40" y1="165" x2="295" y2="165" stroke="#1a1a1a" stroke-width="1.8"/>
    <polygon points="300,165 290,161 290,169" fill="#1a1a1a"/>
    <line x1="40" y1="165" x2="40" y2="18" stroke="#1a1a1a" stroke-width="1.8"/>
    <polygon points="40,12 36,22 44,22" fill="#1a1a1a"/>
    <text x="306" y="170" class="sub">t / s</text>
    <text x="48" y="24" class="sub">v带 / (m·s⁻¹)</text>

    <!-- 折线 (0,2) -> (3,5) -> (4,8) -->
    <!-- y = 165 - v * 16; x = 40 + t * 55 -->
    <polyline points="40,133 205,85 260,37" fill="none" stroke="#1a1a1a" stroke-width="2.4"/>
    <circle cx="40" cy="133" r="3.5" fill="#1a1a1a"/>
    <circle cx="205" cy="85" r="3.5" fill="#1a1a1a"/>
    <circle cx="260" cy="37" r="3.5" fill="#1a1a1a"/>

    <!-- 虚线刻度 -->
    <line x1="205" y1="85" x2="205" y2="165" stroke="#777" stroke-width="1.2" stroke-dasharray="4,4"/>
    <line x1="40" y1="85" x2="205" y2="85" stroke="#777" stroke-width="1.2" stroke-dasharray="4,4"/>
    <line x1="260" y1="37" x2="260" y2="165" stroke="#777" stroke-width="1.2" stroke-dasharray="4,4"/>
    <line x1="40" y1="37" x2="260" y2="37" stroke="#777" stroke-width="1.2" stroke-dasharray="4,4"/>

    <!-- 数值标签 -->
    <text x="28" y="172" text-anchor="end" class="sub">0</text>
    <text x="32" y="138" text-anchor="end" class="sub">2</text>
    <text x="32" y="90" text-anchor="end" class="sub">5</text>
    <text x="32" y="42" text-anchor="end" class="sub">8</text>
    <text x="205" y="185" text-anchor="middle" class="sub">3</text>
    <text x="260" y="185" text-anchor="middle" class="sub">4</text>
    <text x="122" y="98" text-anchor="middle" class="sub">a₁=1</text>
    <text x="255" y="74" text-anchor="start" class="sub">a₂=3</text>
  </g>

  <!-- 设问 -->
  <text x="52" y="446" class="t">（1）滑块首次与传送带达到共速的时刻及共速速度；</text>
  <text x="52" y="480" class="t">（2）t = 3 s 后滑块能否继续与传送带保持相对静止？说明理由；</text>
  <text x="52" y="514" class="t">（3）0 ~ 4 s 内滑块对地的总位移及相对传送带表面的总位移 Δx。</text>
</svg>
