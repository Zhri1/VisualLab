<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fbfbf9"/>
  <text x="32" y="44" font-family="sans-serif" font-size="20" fill="#1c1c1c">恒力一维 · 加速—匀速—减速后平抛</text>
  <text x="32" y="74" font-family="sans-serif" font-size="14" fill="#555550">质量 m = 1.5 kg 的物块在光滑水平面上，先受水平恒力 F₁ = 3 N 作用 2 s，</text>
  <text x="32" y="98" font-family="sans-serif" font-size="14" fill="#555550">撤力匀速 1.5 s，再受反向恒力 F₂ = 1.5 N 作用 2 s，最后从桌沿水平飞出，桌面高 0.8 m。</text>
  <text x="32" y="122" font-family="sans-serif" font-size="14" fill="#555550">求各段末速度、全程位移与落地点到桌沿的水平距离。g = 10 m/s²。</text>
  <line x1="48" y1="240" x2="470" y2="240" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="70" y="212" width="34" height="28" fill="#8e8e88" stroke="#1c1c1c" stroke-width="1.5"/>
  <text x="74" y="206" font-family="sans-serif" font-size="12" fill="#1c1c1c">m</text>
  <line x1="108" y1="226" x2="150" y2="226" stroke="#2f6b3f" stroke-width="2.5"/>
  <path d="M150 226 l-9 -4 v8 z" fill="#2f6b3f"/>
  <text x="106" y="258" font-family="sans-serif" font-size="13" fill="#2f6b3f">F₁ = 3 N，2 s</text>
  <text x="106" y="278" font-family="sans-serif" font-size="12" fill="#555550">a₁ = 2 m/s²</text>
  <rect x="214" y="212" width="34" height="28" fill="#8e8e88" stroke="#1c1c1c" stroke-width="1.5"/>
  <text x="214" y="258" font-family="sans-serif" font-size="13" fill="#555550">F = 0，1.5 s</text>
  <text x="214" y="278" font-family="sans-serif" font-size="12" fill="#555550">匀速 v = 4 m/s</text>
  <rect x="330" y="212" width="34" height="28" fill="#8e8e88" stroke="#1c1c1c" stroke-width="1.5"/>
  <line x1="366" y1="226" x2="326" y2="226" stroke="#8a4b4b" stroke-width="2.5"/>
  <path d="M326 226 l9 -4 v8 z" fill="#8a4b4b"/>
  <text x="316" y="258" font-family="sans-serif" font-size="13" fill="#8a4b4b">F₂ = 1.5 N 反向，2 s</text>
  <text x="316" y="278" font-family="sans-serif" font-size="12" fill="#555550">a₂ = −1 m/s²</text>
  <line x1="470" y1="240" x2="470" y2="300" stroke="#8e8e88" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M470 240 q 34 12 56 58" fill="none" stroke="#1c1c1c" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="526" cy="298" r="5" fill="#1c1c1c"/>
  <text x="480" y="266" font-family="sans-serif" font-size="12" fill="#555550">h = 0.8 m</text>
  <line x1="470" y1="316" x2="526" y2="316" stroke="#1c1c1c" stroke-width="1.5"/>
  <text x="482" y="336" font-family="sans-serif" font-size="12" fill="#1c1c1c">x = ?</text>
</svg>
