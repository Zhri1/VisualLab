  <line x1="264" y1="244" x2="444" y2="172" stroke="#1c1c1c" stroke-width="1.5"/>
  <line x1="464" y1="176" x2="464" y2="248" stroke="#1c1c1c" stroke-width="1.5"/>
  <rect x="450" y="248" width="28" height="26" fill="#5f5f5b"/>
  <text x="484" y="266" font-family="sans-serif" font-size="14" fill="#1c1c1c">m₂</text>
  <line x1="500" y1="274" x2="500" y2="300" stroke="#8e8e88" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="508" y="292" font-family="sans-serif" font-size="13" fill="#555550">h = 2 m</text>
