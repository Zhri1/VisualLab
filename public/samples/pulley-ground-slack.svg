  <text x="32" y="44" font-family="sans-serif" font-size="20" fill="#1c1c1c">连接体 · 斜面桌面着地绳松弛后冲上斜面</text>
  <text x="32" y="74" font-family="sans-serif" font-size="14" fill="#555550">37° 粗糙斜面桌面上 m₁ = 2 kg（μ = μs = 0.25），经定滑轮连 m₂ = 4 kg。</text>
  <text x="32" y="98" font-family="sans-serif" font-size="14" fill="#555550">悬挂物离地 2 m，斜面足够长；sin37° = 0.6、cos37° = 0.8，g = 10 m/s²。</text>
  <text x="32" y="122" font-family="sans-serif" font-size="14" fill="#555550">求：(1) 共同加速度；(2) 着地速度；(3) 松弛后上滑距离；(4) 能否自行返回。</text>
