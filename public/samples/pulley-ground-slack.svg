<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fbfbf9"/>
  <text x="32" y="48" font-family="sans-serif" font-size="20" fill="#1c1c1c">连接体 · 着地后绳松弛</text>
  <text x="32" y="80" font-family="sans-serif" font-size="14" fill="#555550">桌面滑块 m₁ = 2 kg（μ = 0.25）经轻绳绕过理想定滑轮与 m₂ = 3 kg 悬挂物相连。</text>
  <text x="32" y="104" font-family="sans-serif" font-size="14" fill="#555550">悬挂物离地 1.6 m，由静止释放；桌面足够长（滑块限位 5 m）。</text>
  <text x="32" y="128" font-family="sans-serif" font-size="14" fill="#555550">求：共同加速度、着地瞬间速度、着地后滑块继续滑行的距离。</text>
  <line x1="80" y1="250" x2="420" y2="250" stroke="#1c1c1c" stroke-width="3"/>
  <rect x="140" y="222" width="40" height="28" fill="#386e8a"/>
  <text x="146" y="212" font-family="sans-serif" font-size="13" fill="#1c1c1c">m₁</text>
  <circle cx="420" cy="236" r="14" fill="none" stroke="#1c1c1c" stroke-width="2"/>
  <line x1="180" y1="236" x2="406" y2="236" stroke="#7c3aed" stroke-width="2"/>
  <line x1="434" y1="236" x2="434" y2="290" stroke="#7c3aed" stroke-width="2"/>
  <rect x="420" y="290" width="28" height="26" fill="#b42318"/>
  <text x="452" y="308" font-family="sans-serif" font-size="13" fill="#1c1c1c">m₂</text>
  <line x1="400" y1="330" x2="480" y2="330" stroke="#1c1c1c" stroke-width="3"/>
  <text x="452" y="270" font-family="sans-serif" font-size="12" fill="#555550">1.6 m</text>
</svg>
