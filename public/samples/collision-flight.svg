<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#ffffff"/>
  <style>
    .t { font-family: "SimSun", "Songti SC", "PingFang SC", "Microsoft YaHei", serif; fill: #1a1a1a; font-size: 21px; }
    .m { font-family: "Times New Roman", "Cambria Math", Georgia, serif; font-style: italic; fill: #1a1a1a; font-size: 21px; }
    .lbl { font-family: "Times New Roman", Georgia, serif; font-style: italic; fill: #1a1a1a; font-size: 20px; }
    .sub { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill: #333333; font-size: 16px; }
  </style>

  <!-- 题干文字 -->
  <text x="52" y="56" class="t">2. 如图所示，光滑水平桌面右沿在 x = 5 m 处，桌面离水平地面的高度 h = 1.25 m。</text>
  <text x="52" y="92" class="t">   质量 m₁ = 1 kg 的物块 A 从 x = 0 处以 v₁ = 5 m/s 的速度向右运动，前方 x = 4 m</text>
  <text x="52" y="128" class="t">   处有质量 m₂ = 3 kg 的物块 B 以 v₂ = 1 m/s 同向运动。两物块发生弹性正碰，碰</text>
  <text x="52" y="164" class="t">   撞时间极短且外冲量可忽略，重力加速度 g 取 10 m/s²。求：</text>

  <!-- 示意图 -->
  <g transform="translate(0, 10)">
    <!-- 光滑桌面与桌腿 -->
    <line x1="110" y1="300" x2="620" y2="300" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="620" y1="300" x2="620" y2="415" stroke="#1a1a1a" stroke-width="2.2"/>
    <rect x="110" y="300" width="510" height="12" fill="#f0f0ec" stroke="none"/>
    <!-- 地面 -->
    <line x1="560" y1="415" x2="860" y2="415" stroke="#1a1a1a" stroke-width="2.5"/>
    <g stroke="#666" stroke-width="1.2">
      <line x1="575" y1="415" x2="565" y2="427"/><line x1="595" y1="415" x2="585" y2="427"/>
      <line x1="615" y1="415" x2="605" y2="427"/><line x1="635" y1="415" x2="625" y2="427"/>
      <line x1="655" y1="415" x2="645" y2="427"/><line x1="675" y1="415" x2="665" y2="427"/>
      <line x1="695" y1="415" x2="685" y2="427"/><line x1="715" y1="415" x2="705" y2="427"/>
      <line x1="735" y1="415" x2="725" y2="427"/><line x1="755" y1="415" x2="745" y2="427"/>
      <line x1="775" y1="415" x2="765" y2="427"/><line x1="795" y1="415" x2="785" y2="427"/>
      <line x1="815" y1="415" x2="805" y2="427"/><line x1="835" y1="415" x2="825" y2="427"/>
    </g>

    <!-- 物块 A -->
    <rect x="155" y="264" width="38" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
    <text x="174" y="289" text-anchor="middle" class="lbl">A</text>
    <line x1="196" y1="282" x2="256" y2="282" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="262,282 250,277 250,287" fill="#1a1a1a"/>
    <text x="228" y="268" text-anchor="middle" class="sub">v₁ = 5 m/s</text>
    <text x="174" y="252" text-anchor="middle" class="sub">m₁ = 1 kg</text>

    <!-- 物块 B -->
    <rect x="465" y="256" width="48" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
    <text x="489" y="285" text-anchor="middle" class="lbl">B</text>
    <line x1="516" y1="278" x2="554" y2="278" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="560,278 548,273 548,283" fill="#1a1a1a"/>
    <text x="538" y="264" text-anchor="middle" class="sub">v₂ = 1 m/s</text>
    <text x="489" y="244" text-anchor="middle" class="sub">m₂ = 3 kg</text>

    <!-- 距离与高度标注 -->
    <line x1="174" y1="308" x2="174" y2="338" stroke="#666" stroke-width="1.2" stroke-dasharray="3,3"/>
    <line x1="489" y1="308" x2="489" y2="338" stroke="#666" stroke-width="1.2" stroke-dasharray="3,3"/>
    <line x1="174" y1="330" x2="489" y2="330" stroke="#555" stroke-width="1.3"/>
    <text x="332" y="352" text-anchor="middle" class="sub">初距 4 m（桌沿 x = 5 m）</text>

    <!-- 高度 h = 1.25 m -->
    <line x1="646" y1="300" x2="646" y2="415" stroke="#555" stroke-width="1.4"/>
    <line x1="636" y1="300" x2="656" y2="300" stroke="#555" stroke-width="1.4"/>
    <text x="664" y="362" class="sub">h = 1.25 m</text>

    <!-- 飞出平抛示意虚线 -->
    <path d="M 620 282 Q 735 282 795 415" fill="none" stroke="#666" stroke-width="1.8" stroke-dasharray="6,5"/>
    <circle cx="795" cy="415" r="4" fill="#1a1a1a"/>
    <text x="806" y="405" class="sub">落地点</text>
  </g>

  <!-- 设问 -->
  <text x="52" y="472" class="t">（1）弹性碰撞后物块 A、B 的速度大小与方向；</text>
  <text x="52" y="508" class="t">（2）物块 B 飞出桌沿后的落地时间、水平位移及落地时物块 A 的位置。</text>
</svg>
