<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fbfbf9"/>
  <text x="32" y="48" font-family="sans-serif" font-size="20" fill="#1c1c1c">传送带模型</text>
  <text x="32" y="80" font-family="sans-serif" font-size="14" fill="#555550">水平传送带先以 2 m/s 匀速运行，随后以 1 m/s² 加速 3 s。</text>
  <text x="32" y="104" font-family="sans-serif" font-size="14" fill="#555550">将物块无初速轻放于带面左端。μ = 0.2，μs = 0.25，g = 10 m/s²。</text>
  <text x="32" y="128" font-family="sans-serif" font-size="14" fill="#555550">求：(1) 相对滑动痕迹长度；(2) 共速后物块是否相对带面打滑。</text>
  <rect x="80" y="220" width="480" height="26" fill="#e8e8e3" stroke="#1c1c1c" stroke-width="2"/>
  <circle cx="93" cy="233" r="13" fill="none" stroke="#1c1c1c" stroke-width="2"/>
  <circle cx="547" cy="233" r="13" fill="none" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="120" y="192" width="34" height="28" fill="#386e8a"/>
  <text x="126" y="182" font-family="sans-serif" font-size="14" fill="#1c1c1c">m</text>
  <line x1="200" y1="206" x2="260" y2="206" stroke="#1c1c1c" stroke-width="2"/>
  <path d="M260 206 l-8 -4 v8 z" fill="#1c1c1c"/>
  <text x="204" y="196" font-family="sans-serif" font-size="13" fill="#1c1c1c">v带 = 2 m/s</text>
  <line x1="120" y1="268" x2="240" y2="268" stroke="#b42318" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="120" y="290" font-family="sans-serif" font-size="13" fill="#b42318">痕迹 Δx</text>
</svg>
