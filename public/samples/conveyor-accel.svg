<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fbfbf9"/>
  <text x="32" y="44" font-family="sans-serif" font-size="20" fill="#1c1c1c">传送带 · 轻放留痕后滑离带端平抛</text>
  <text x="32" y="74" font-family="sans-serif" font-size="14" fill="#555550">水平传送带以 2 m/s 匀速运行，带长 2 m、带端离地 1.25 m。</text>
  <text x="32" y="98" font-family="sans-serif" font-size="14" fill="#555550">物块无初速轻放于左端，μ = 0.2，g = 10 m/s²。</text>
  <text x="32" y="122" font-family="sans-serif" font-size="14" fill="#555550">求：(1) 痕迹长度；(2) 离带速度；(3) 落地点到带端的水平距离。</text>
  <line x1="60" y1="300" x2="600" y2="300" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="100" y="200" width="300" height="22" fill="#e8e8e3" stroke="#1c1c1c" stroke-width="2"/>
  <circle cx="111" cy="211" r="11" fill="none" stroke="#1c1c1c" stroke-width="2"/>
  <circle cx="389" cy="211" r="11" fill="none" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="120" y="172" width="30" height="28" fill="#8e8e88"/>
  <text x="126" y="162" font-family="sans-serif" font-size="14" fill="#1c1c1c">m</text>
  <line x1="200" y1="186" x2="260" y2="186" stroke="#1c1c1c" stroke-width="2"/>
  <path d="M260 186 l-8 -4 v8 z" fill="#1c1c1c"/>
  <text x="204" y="176" font-family="sans-serif" font-size="13" fill="#1c1c1c">v带 = 2 m/s</text>
  <line x1="120" y1="240" x2="250" y2="240" stroke="#8a4b4b" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="120" y="262" font-family="sans-serif" font-size="13" fill="#8a4b4b">痕迹 Δx = 1 m</text>
  <path d="M400 200 q 60 10 90 100" fill="none" stroke="#1c1c1c" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="490" cy="298" r="5" fill="#1c1c1c"/>
  <line x1="400" y1="222" x2="400" y2="300" stroke="#8e8e88" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="408" y="266" font-family="sans-serif" font-size="13" fill="#555550">h = 1.25 m</text>
  <line x1="400" y1="316" x2="490" y2="316" stroke="#1c1c1c" stroke-width="1.5"/>
  <text x="418" y="336" font-family="sans-serif" font-size="13" fill="#1c1c1c">x = ?</text>
</svg>
