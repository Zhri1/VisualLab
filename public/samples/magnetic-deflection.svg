<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fbfbf9"/>
  <text x="32" y="44" font-family="sans-serif" font-size="20" fill="#1c1c1c">组合场 · 磁场偏转后平抛落回地面</text>
  <text x="32" y="74" font-family="sans-serif" font-size="14" fill="#555550">宽 1 m 的匀强磁场 B = 1 T 垂直纸面向里，下边界贴地面。</text>
  <text x="32" y="98" font-family="sans-serif" font-size="14" fill="#555550">m = 1×10⁻³ kg、q = +1×10⁻³ C 以 2 m/s 沿地面射入；出磁后 g = 10 m/s²。</text>
  <text x="32" y="122" font-family="sans-serif" font-size="14" fill="#555550">求：(1) 磁中半径；(2) 偏转角与出射速度；(3) 落点到入射点水平距离。</text>
  <line x1="60" y1="300" x2="600" y2="300" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="140" y="160" width="150" height="140" fill="none" stroke="#1c1c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <g fill="#8e8e88" font-family="sans-serif" font-size="14">
    <text x="165" y="195">×</text><text x="215" y="195">×</text><text x="265" y="195">×</text>
    <text x="165" y="240">×</text><text x="215" y="240">×</text><text x="265" y="240">×</text>
    <text x="165" y="285">×</text><text x="215" y="285">×</text><text x="265" y="285">×</text>
  </g>
  <text x="150" y="150" font-family="sans-serif" font-size="13" fill="#555550">B = 1 T ⊗</text>
  <path d="M140 300 A 150 150 0 0 0 290 260" fill="none" stroke="#8a4b4b" stroke-width="2.5"/>
  <circle cx="140" cy="300" r="5" fill="#1c1c1c"/>
  <line x1="90" y1="300" x2="132" y2="300" stroke="#1c1c1c" stroke-width="2"/>
  <path d="M132 300 l-8 -4 v8 z" fill="#1c1c1c"/>
  <text x="86" y="288" font-family="sans-serif" font-size="13" fill="#1c1c1c">v₀ = 2 m/s</text>
  <path d="M290 260 q 60 -18 110 40" fill="none" stroke="#1c1c1c" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="400" cy="298" r="5" fill="#1c1c1c"/>
  <line x1="140" y1="316" x2="400" y2="316" stroke="#1c1c1c" stroke-width="1.5"/>
  <text x="240" y="336" font-family="sans-serif" font-size="13" fill="#1c1c1c">x = ?</text>
</svg>
