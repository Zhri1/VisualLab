<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fbfbf9"/>
  <text x="32" y="44" font-family="sans-serif" font-size="20" fill="#1c1c1c">弹性正碰 · 碰后摆球上摆</text>
  <text x="32" y="74" font-family="sans-serif" font-size="14" fill="#555550">质量 m₁ = 1 kg 的滑块以 v₀ = 2 m/s 在光滑水平面上运动，与静止的 m₂ = 3 kg 小球</text>
  <text x="32" y="98" font-family="sans-serif" font-size="14" fill="#555550">发生弹性正碰。小球用长 L = 1 m 的轻绳悬挂于 O 点。g = 10 m/s²。</text>
  <text x="32" y="122" font-family="sans-serif" font-size="14" fill="#555550">求碰后两者的速度，以及小球摆起的最大高度与最大摆角。</text>
  <line x1="60" y1="300" x2="600" y2="300" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="90" y="272" width="36" height="28" fill="#8e8e88" stroke="#1c1c1c" stroke-width="1.5"/>
  <text x="94" y="266" font-family="sans-serif" font-size="12" fill="#1c1c1c">m₁</text>
  <line x1="130" y1="286" x2="196" y2="286" stroke="#2f6b3f" stroke-width="2.5"/>
  <path d="M196 286 l-9 -4 v8 z" fill="#2f6b3f"/>
  <text x="132" y="276" font-family="sans-serif" font-size="13" fill="#2f6b3f">v₀ = 2 m/s</text>
  <line x1="400" y1="140" x2="520" y2="140" stroke="#1c1c1c" stroke-width="3"/>
  <line x1="460" y1="140" x2="460" y2="286" stroke="#555550" stroke-width="1.5"/>
  <circle cx="460" cy="286" r="16" fill="#e6cfc9" stroke="#1c1c1c" stroke-width="2"/>
  <text x="460" y="291" font-family="sans-serif" font-size="12" fill="#1c1c1c" text-anchor="middle">m₂</text>
  <text x="466" y="146" font-family="sans-serif" font-size="12" fill="#1c1c1c">O</text>
  <text x="470" y="216" font-family="sans-serif" font-size="12" fill="#555550">L = 1 m</text>
  <line x1="460" y1="286" x2="530" y2="196" stroke="#8a4b4b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="530" cy="196" r="16" fill="#e6cfc9" stroke="#8a4b4b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M470 250 A 70 70 0 0 1 498 226" fill="none" stroke="#8a4b4b" stroke-width="1.6"/>
  <text x="500" y="252" font-family="sans-serif" font-size="12" fill="#8a4b4b">θ</text>
  <line x1="546" y1="196" x2="546" y2="286" stroke="#8e8e88" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="552" y="242" font-family="sans-serif" font-size="12" fill="#555550">h = ?</text>
  <text x="32" y="336" font-family="sans-serif" font-size="13" fill="#555550">弹性正碰：v₁′ = (m₁−m₂)v₀/(m₁+m₂)，v₂′ = 2m₁v₀/(m₁+m₂)；上摆 h = v₂′²/(2g)</text>
</svg>
