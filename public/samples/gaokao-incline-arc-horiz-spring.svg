<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#ffffff"/>
  <style>
    .t { font-family: "SimSun", "Songti SC", "PingFang SC", "Microsoft YaHei", serif; fill: #1a1a1a; font-size: 20.5px; }
    .lbl { font-family: "Times New Roman", Georgia, serif; font-style: italic; fill: #1a1a1a; font-size: 20px; }
    .sub { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill: #333333; font-size: 15.5px; }
  </style>

  <!-- 题干文字 -->
  <text x="48" y="50" class="t">3. 如图所示，倾角 θ = 37°、长 L₁ = 5 m 的粗糙斜面 AB（μ₁ = 0.25）下端 B 与半径</text>
  <text x="48" y="84" class="t">   R = 2.5 m、圆心角 37° 的光滑圆弧轨道 BC 相切，C 点切线水平并接长 L₂ = 3 m 的</text>
  <text x="48" y="118" class="t">   粗糙水平轨道 CD（μ₂ = 0.20）。D 点右侧水平面动摩擦因数 μk = 0.15、静摩擦因数</text>
  <text x="48" y="152" class="t">   μs = 0.20，固定一原长左端恰在 D 点的轻弹簧（k = 60 N/m）。质量 m = 1 kg 的滑</text>
  <text x="48" y="186" class="t">   块从 A 点由静止释放，滑块与弹簧不连接，g 取 10 m/s²。求：</text>

  <!-- 示意图 -->
  <g transform="translate(0, 14)">
    <!-- 斜面 AB -->
    <line x1="120" y1="220" x2="310" y2="362" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="120" y1="220" x2="120" y2="395" stroke="#888" stroke-width="1.3" stroke-dasharray="4,4"/>
    <line x1="120" y1="395" x2="455" y2="395" stroke="#888" stroke-width="1.2" stroke-dasharray="4,4"/>
    <!-- 斜面物块 A -->
    <g transform="translate(136, 212) rotate(37)">
      <rect x="0" y="-22" width="28" height="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
      <text x="14" y="-6" text-anchor="middle" class="lbl" style="font-size:15px">m</text>
    </g>
    <text x="100" y="218" class="lbl">A</text>
    <text x="216" y="275" class="sub">L₁ = 5 m, μ₁ = 0.25</text>
    <text x="242" y="348" class="sub">37°</text>

    <!-- 圆弧 BC (中心 O 在 C 上方) -->
    <path d="M 310 362 A 115 115 0 0 0 385 395" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="385" y1="280" x2="310" y2="362" stroke="#777" stroke-width="1.3" stroke-dasharray="4,4"/>
    <line x1="385" y1="280" x2="385" y2="395" stroke="#777" stroke-width="1.3" stroke-dasharray="4,4"/>
    <circle cx="385" cy="280" r="2.8" fill="#1a1a1a"/>
    <text x="394" y="280" class="lbl">O</text>
    <text x="352" y="330" class="sub">37°</text>
    <text x="395" y="346" class="sub">R = 2.5 m</text>
    <text x="295" y="384" class="lbl">B</text>
    <text x="380" y="420" class="lbl">C</text>

    <!-- 粗糙水平 CD + 弹簧段 -->
    <line x1="385" y1="395" x2="860" y2="395" stroke="#1a1a1a" stroke-width="2.5"/>
    <g stroke="#777" stroke-width="1.2">
      <line x1="405" y1="395" x2="397" y2="406"/><line x1="430" y1="395" x2="422" y2="406"/>
      <line x1="455" y1="395" x2="447" y2="406"/><line x1="480" y1="395" x2="472" y2="406"/>
      <line x1="505" y1="395" x2="497" y2="406"/><line x1="530" y1="395" x2="522" y2="406"/>
      <line x1="555" y1="395" x2="547" y2="406"/><line x1="580" y1="395" x2="572" y2="406"/>
      <line x1="605" y1="395" x2="597" y2="406"/><line x1="630" y1="395" x2="622" y2="406"/>
      <line x1="665" y1="395" x2="657" y2="406"/><line x1="700" y1="395" x2="692" y2="406"/>
      <line x1="735" y1="395" x2="727" y2="406"/><line x1="770" y1="395" x2="762" y2="406"/>
      <line x1="805" y1="395" x2="797" y2="406"/><line x1="840" y1="395" x2="832" y2="406"/>
    </g>
    <text x="512" y="382" text-anchor="middle" class="sub">L₂ = 3 m, μ₂ = 0.20</text>
    <text x="642" y="420" class="lbl">D</text>

    <!-- 弹簧与右墙 -->
    <line x1="860" y1="352" x2="860" y2="395" stroke="#1a1a1a" stroke-width="2.6"/>
    <g stroke="#666" stroke-width="1.2">
      <line x1="860" y1="358" x2="870" y2="352"/><line x1="860" y1="370" x2="870" y2="364"/>
      <line x1="860" y1="382" x2="870" y2="376"/><line x1="860" y1="394" x2="870" y2="388"/>
    </g>
    <polyline points="648,378 666,378 676,366 692,390 708,366 724,390 740,366 756,390 772,366 788,390 804,366 820,390 832,378 860,378" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="648" y1="364" x2="648" y2="395" stroke="#1a1a1a" stroke-width="2"/>
    <text x="752" y="352" text-anchor="middle" class="sub">k = 60 N/m（μk=0.15, μs=0.20）</text>
  </g>

  <!-- 设问 -->
  <text x="48" y="472" class="t">（1）滑块经过圆弧最低点 C 时的速率及对轨道的压力大小；</text>
  <text x="48" y="506" class="t">（2）弹簧的最大压缩量、是否能回弹脱离弹簧，以及全过程的摩擦产热。</text>
</svg>
