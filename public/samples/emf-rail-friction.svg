<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fbfbf9"/>
  <text x="32" y="44" font-family="sans-serif" font-size="20" fill="#1c1c1c">电磁感应 · 粗糙导轨上导体棒的减速</text>
  <text x="32" y="74" font-family="sans-serif" font-size="14" fill="#555550">B = 0.5 T 垂直纸面向里，导轨间距 L = 1.0 m，回路总电阻 R = 0.4 Ω，</text>
  <text x="32" y="98" font-family="sans-serif" font-size="14" fill="#555550">棒质量 m = 0.2 kg，与导轨间动摩擦因数 μ = 0.1，以 v₀ = 10 m/s 滑上导轨。</text>

  <!-- 磁场符号：垂直纸面向里 -->
  <g stroke="#8e8e88" stroke-width="1.4">
    <path d="M196 191 l8 8 M204 191 l-8 8"/>
    <path d="M256 191 l8 8 M264 191 l-8 8"/>
    <path d="M316 191 l8 8 M324 191 l-8 8"/>
    <path d="M436 191 l8 8 M444 191 l-8 8"/>
    <path d="M496 191 l8 8 M504 191 l-8 8"/>
    <path d="M196 231 l8 8 M204 231 l-8 8"/>
    <path d="M256 231 l8 8 M264 231 l-8 8"/>
    <path d="M316 231 l8 8 M324 231 l-8 8"/>
    <path d="M436 231 l8 8 M444 231 l-8 8"/>
    <path d="M496 231 l8 8 M504 231 l-8 8"/>
  </g>

  <!-- 平行导轨 -->
  <line x1="120" y1="160" x2="560" y2="160" stroke="#1c1c1c" stroke-width="2.5"/>
  <line x1="120" y1="260" x2="560" y2="260" stroke="#1c1c1c" stroke-width="2.5"/>

  <!-- 左端电阻 -->
  <line x1="120" y1="160" x2="120" y2="196" stroke="#1c1c1c" stroke-width="2.5"/>
  <path d="M120 196 l-10 8 l20 8 l-20 8 l20 8 l-20 8 l20 8 l-10 8" fill="none" stroke="#1c1c1c" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="120" y1="252" x2="120" y2="260" stroke="#1c1c1c" stroke-width="2.5"/>
  <text x="66" y="228" font-family="sans-serif" font-size="13" fill="#1c1c1c">R</text>

  <!-- 导体棒 -->
  <rect x="374" y="152" width="12" height="116" rx="2" fill="#8a4b4b" stroke="#1c1c1c" stroke-width="1.5"/>
  <text x="380" y="292" font-family="sans-serif" font-size="13" fill="#1c1c1c" text-anchor="middle">导体棒 m</text>

  <!-- 速度箭头 -->
  <line x1="392" y1="140" x2="470" y2="140" stroke="#2f6b3f" stroke-width="2.4"/>
  <path d="M470 140 l-10 -5 v10 z" fill="#2f6b3f"/>
  <text x="432" y="132" font-family="sans-serif" font-size="13" fill="#2f6b3f" text-anchor="middle">v₀</text>

  <!-- 电流方向（棒向右运动，向里的磁场 → 回路中电流逆时针，沿上轨向左） -->
  <line x1="368" y1="160" x2="300" y2="160" stroke="#2a5b8f" stroke-width="2"/>
  <path d="M300 160 l10 -4 v8 z" fill="#2a5b8f"/>
  <text x="330" y="152" font-family="sans-serif" font-size="12" fill="#2a5b8f" text-anchor="middle">I</text>

  <!-- 安培力箭头（阻碍相对运动，指向左） -->
  <line x1="374" y1="212" x2="310" y2="212" stroke="#a8562a" stroke-width="2.2"/>
  <path d="M310 212 l10 -4.5 v9 z" fill="#a8562a"/>
  <text x="336" y="228" font-family="sans-serif" font-size="12" fill="#a8562a" text-anchor="middle">F安</text>

  <!-- 间距标注 -->
  <line x1="590" y1="160" x2="590" y2="260" stroke="#8a4b4b" stroke-width="1.4"/>
  <line x1="586" y1="160" x2="594" y2="160" stroke="#8a4b4b" stroke-width="1.4"/>
  <line x1="586" y1="260" x2="594" y2="260" stroke="#8a4b4b" stroke-width="1.4"/>
  <text x="600" y="214" font-family="sans-serif" font-size="12" fill="#8a4b4b">L</text>

  <text x="32" y="316" font-family="sans-serif" font-size="13" fill="#555550">ε = BLv　I = ε/R　F安 = B²L²v/R　q = BLx/R</text>
  <text x="32" y="340" font-family="sans-serif" font-size="13" fill="#8a4b4b">安培力只让速度趋近于零，真正让棒停下来的是摩擦。</text>
</svg>
