<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#ffffff"/>
  <style>
    .t { font-family: "SimSun", "Songti SC", "PingFang SC", "Microsoft YaHei", serif; fill: #1a1a1a; font-size: 21px; }
    .lbl { font-family: "Times New Roman", Georgia, serif; font-style: italic; fill: #1a1a1a; font-size: 20px; }
    .sub { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill: #333333; font-size: 16px; }
  </style>

  <!-- 题干文字 -->
  <text x="52" y="54" class="t">4. 如图所示，质量 m₁ = 2 kg 的物块置于粗糙水平桌面上，与桌面间动摩擦因数</text>
  <text x="52" y="90" class="t">   μ = 0.25，距桌沿理想轻质定滑轮的水平距离 L = 5 m。不可伸长的轻绳一端连</text>
  <text x="52" y="126" class="t">   接 m₁，绕过定滑轮后另一端悬挂质量 m₂ = 3 kg 的重物，重物初始离水平地面高</text>
  <text x="52" y="162" class="t">   度 h = 1.6 m。系统由静止释放，重物着地后不反弹，g 取 10 m/s²。求：</text>

  <!-- 示意图 -->
  <g transform="translate(30, 8)">
    <!-- 粗糙水平桌面 -->
    <line x1="120" y1="255" x2="625" y2="255" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="625" y1="255" x2="625" y2="412" stroke="#1a1a1a" stroke-width="2.2"/>
    <g stroke="#777" stroke-width="1.2">
      <line x1="140" y1="255" x2="132" y2="266"/><line x1="165" y1="255" x2="157" y2="266"/>
      <line x1="190" y1="255" x2="182" y2="266"/><line x1="215" y1="255" x2="207" y2="266"/>
      <line x1="240" y1="255" x2="232" y2="266"/><line x1="265" y1="255" x2="257" y2="266"/>
      <line x1="290" y1="255" x2="282" y2="266"/><line x1="315" y1="255" x2="307" y2="266"/>
      <line x1="340" y1="255" x2="332" y2="266"/><line x1="365" y1="255" x2="357" y2="266"/>
      <line x1="390" y1="255" x2="382" y2="266"/><line x1="415" y1="255" x2="407" y2="266"/>
      <line x1="440" y1="255" x2="432" y2="266"/><line x1="465" y1="255" x2="457" y2="266"/>
      <line x1="490" y1="255" x2="482" y2="266"/><line x1="515" y1="255" x2="507" y2="266"/>
      <line x1="540" y1="255" x2="532" y2="266"/><line x1="565" y1="255" x2="557" y2="266"/>
      <line x1="590" y1="255" x2="582" y2="266"/>
    </g>

    <!-- 水平地面 -->
    <line x1="570" y1="412" x2="825" y2="412" stroke="#1a1a1a" stroke-width="2.5"/>
    <g stroke="#666" stroke-width="1.2">
      <line x1="585" y1="412" x2="575" y2="424"/><line x1="610" y1="412" x2="600" y2="424"/>
      <line x1="635" y1="412" x2="625" y2="424"/><line x1="660" y1="412" x2="650" y2="424"/>
      <line x1="685" y1="412" x2="675" y2="424"/><line x1="710" y1="412" x2="700" y2="424"/>
      <line x1="735" y1="412" x2="725" y2="424"/><line x1="760" y1="412" x2="750" y2="424"/>
      <line x1="785" y1="412" x2="775" y2="424"/><line x1="810" y1="412" x2="800" y2="424"/>
    </g>

    <!-- 定滑轮 -->
    <line x1="625" y1="255" x2="646" y2="236" stroke="#1a1a1a" stroke-width="2.4"/>
    <circle cx="646" cy="236" r="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
    <circle cx="646" cy="236" r="3" fill="#1a1a1a"/>

    <!-- 轻绳 -->
    <line x1="250" y1="221" x2="646" y2="221" stroke="#1a1a1a" stroke-width="1.9"/>
    <line x1="661" y1="236" x2="661" y2="302" stroke="#1a1a1a" stroke-width="1.9"/>

    <!-- 物块 m1 -->
    <rect x="200" y="211" width="50" height="44" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
    <text x="225" y="240" text-anchor="middle" class="lbl">m₁</text>
    <text x="225" y="200" text-anchor="middle" class="sub">m₁ = 2 kg</text>
    <text x="415" y="286" text-anchor="middle" class="sub">粗糙桌面 μ = 0.25，L = 5 m</text>

    <!-- 重物 m2 -->
    <rect x="641" y="302" width="40" height="42" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/>
    <text x="661" y="329" text-anchor="middle" class="lbl">m₂</text>
    <text x="728" y="328" class="sub">m₂ = 3 kg</text>

    <!-- 离地高度 h = 1.6 m -->
    <line x1="704" y1="344" x2="704" y2="412" stroke="#555" stroke-width="1.4"/>
    <line x1="694" y1="344" x2="714" y2="344" stroke="#555" stroke-width="1.4"/>
    <text x="722" y="384" class="sub">h = 1.6 m</text>
  </g>

  <!-- 设问 -->
  <text x="52" y="454" class="t">（1）重物 m₂ 着地前系统的共同加速度大小与轻绳张力 T；</text>
  <text x="52" y="490" class="t">（2）重物着地瞬间轻绳松弛后，物块 m₁ 继续滑行的距离与总位移（是否撞上滑轮？）。</text>
</svg>
