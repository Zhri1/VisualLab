<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#ffffff"/>
  <style>
    .t { font-family: "SimSun", "Songti SC", "PingFang SC", "Microsoft YaHei", serif; fill: #1a1a1a; font-size: 20.5px; }
    .lbl { font-family: "Times New Roman", Georgia, serif; font-style: italic; fill: #1a1a1a; font-size: 20px; }
    .sub { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill: #333333; font-size: 15px; }
  </style>

  <!-- 题干文字 -->
  <text x="48" y="48" class="t">4. 如图所示，水平粗糙轨道 AB 长 L₁ = 3 m（μ₁ = 0.1），左端固定劲度系数 k = 500 N/m</text>
  <text x="48" y="82" class="t">   的轻弹簧，右端 B 与半径 R = 2 m、圆心角 45° 的光滑上仰圆弧跳台 BC 相切。质量</text>
  <text x="48" y="116" class="t">   m = 0.5 kg 的小滑块将弹簧压缩 x₀ = 0.22 m 后在 A 点由静止释放，从 C 点飞出做斜</text>
  <text x="48" y="150" class="t">   抛运动，恰在与 AB 等高的 D 点沿切线滑入倾角 53°、长 L₂ = 4 m 的粗糙斜坡 DE</text>
  <text x="48" y="184" class="t">   （μ₂ = 0.2），g 取 10 m/s²。求：</text>

  <!-- 示意图 -->
  <g transform="translate(0, 8)">
    <!-- 水平等高虚线 -->
    <line x1="76" y1="322" x2="725" y2="322" stroke="#999" stroke-width="1.2" stroke-dasharray="4,4"/>

    <!-- 左墙与预压弹簧 A -->
    <line x1="80" y1="286" x2="80" y2="322" stroke="#1a1a1a" stroke-width="2.6"/>
    <polyline points="80,308 92,308 97,298 104,318 111,298 118,318 125,298 132,318 137,308 146,308" fill="none" stroke="#1a1a1a" stroke-width="1.9"/>
    <rect x="146" y="294" width="26" height="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="159" y="313" text-anchor="middle" class="lbl" style="font-size:15px">m</text>
    <text x="152" y="346" class="lbl">A</text>
    <text x="122" y="278" text-anchor="middle" class="sub">k=500, x₀=0.22m</text>

    <!-- 粗糙水平 AB -->
    <line x1="80" y1="322" x2="310" y2="322" stroke="#1a1a1a" stroke-width="2.5"/>
    <g stroke="#777" stroke-width="1.1">
      <line x1="100" y1="322" x2="93" y2="332"/><line x1="125" y1="322" x2="118" y2="332"/>
      <line x1="150" y1="322" x2="143" y2="332"/><line x1="175" y1="322" x2="168" y2="332"/>
      <line x1="200" y1="322" x2="193" y2="332"/><line x1="225" y1="322" x2="218" y2="332"/>
      <line x1="250" y1="322" x2="243" y2="332"/><line x1="275" y1="322" x2="268" y2="332"/>
      <line x1="300" y1="322" x2="293" y2="332"/>
    </g>
    <text x="235" y="348" text-anchor="middle" class="sub">L₁ = 3 m, μ₁ = 0.1</text>
    <text x="306" y="346" class="lbl">B</text>

    <!-- 向上圆弧跳台 BC (0° -> 45°) -->
    <path d="M 310 322 A 110 110 0 0 0 388 290" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="310" y1="212" x2="310" y2="322" stroke="#888" stroke-width="1.2" stroke-dasharray="4,4"/>
    <line x1="310" y1="212" x2="388" y2="290" stroke="#888" stroke-width="1.2" stroke-dasharray="4,4"/>
    <circle cx="310" cy="212" r="2.6" fill="#1a1a1a"/>
    <text x="296" y="214" class="lbl">O</text>
    <text x="328" y="254" class="sub">45°</text>
    <text x="394" y="308" class="lbl">C</text>

    <!-- 空中斜抛虚线 C -> 最高点 -> D (与 AB 等高 y=322) -->
    <path d="M 388 290 Q 545 142 688 322" fill="none" stroke="#555" stroke-width="1.9" stroke-dasharray="6,5"/>
    <circle cx="538" cy="218" r="3" fill="#555"/>
    <text x="538" y="206" text-anchor="middle" class="sub">斜抛最高点</text>

    <!-- 切向进入 53° 粗糙斜坡 DE -->
    <line x1="688" y1="322" x2="808" y2="420" stroke="#1a1a1a" stroke-width="2.6"/>
    <circle cx="688" cy="322" r="3.2" fill="#1a1a1a"/>
    <text x="700" y="314" class="lbl">D</text>
    <text x="818" y="424" class="lbl">E</text>
    <text x="780" y="356" class="sub">53°, L₂ = 4 m</text>
    <text x="780" y="376" class="sub">μ₂ = 0.2</text>
  </g>

  <!-- 设问 -->
  <text x="48" y="472" class="t">（1）滑块脱离弹簧后到达圆弧跳台顶端 C 点的速度及所受轨道支持力；</text>
  <text x="48" y="506" class="t">（2）斜抛达到的最高点高度、飞抵 D 点的时间以及滑至斜坡底端 E 时的速度。</text>
</svg>
