<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fbfbf9"/>
  <text x="32" y="44" font-family="sans-serif" font-size="20" fill="#1c1c1c">可移动圆弧槽 · 球离槽经弹簧恰好不再滑上</text>
  <text x="32" y="74" font-family="sans-serif" font-size="14" fill="#555550">M = 3 kg、R = 0.6 m 的四分之一光滑圆弧槽静置光滑地面，可自由滑动。</text>
  <text x="32" y="98" font-family="sans-serif" font-size="14" fill="#555550">m₁ = 1 kg 从槽顶静止释放；m₂ 右侧连轻质自由弹簧，m₂ 质量未知。</text>
  <text x="32" y="122" font-family="sans-serif" font-size="14" fill="#555550">m₁ 恰好不能再次滑上槽。求：(1) 离槽时槽速；(2) m₂；(3) 弹簧最大弹性势能。</text>
  <line x1="60" y1="300" x2="600" y2="300" stroke="#1c1c1c" stroke-width="2"/>
  <path d="M470 180 A 120 120 0 0 1 350 300" fill="none" stroke="#1c1c1c" stroke-width="2.5"/>
  <line x1="470" y1="180" x2="470" y2="300" stroke="#8e8e88" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="478" y="244" font-family="sans-serif" font-size="13" fill="#555550">R</text>
  <text x="420" y="262" font-family="sans-serif" font-size="14" fill="#1c1c1c">M</text>
  <circle cx="466" cy="172" r="10" fill="#8e8e88"/>
  <text x="440" y="160" font-family="sans-serif" font-size="14" fill="#1c1c1c">m₁</text>
  <circle cx="150" cy="290" r="10" fill="#b4b4ae"/>
  <text x="140" y="272" font-family="sans-serif" font-size="14" fill="#1c1c1c">m₂</text>
  <path d="M162 290 l8 -8 l8 16 l8 -16 l8 16 l8 -16 l8 16 l6 -8" fill="none" stroke="#1c1c1c" stroke-width="1.5"/>
  <line x1="216" y1="290" x2="228" y2="290" stroke="#1c1c1c" stroke-width="1.5"/>
  <path d="M340 292 l -60 0" stroke="#8a4b4b" stroke-width="2"/>
  <path d="M280 292 l 8 -4 v 8 z" fill="#8a4b4b"/>
  <text x="286" y="280" font-family="sans-serif" font-size="13" fill="#8a4b4b">v₁ = 3 m/s</text>
  <path d="M480 292 l 40 0" stroke="#1c1c1c" stroke-width="2"/>
  <path d="M520 292 l -8 -4 v 8 z" fill="#1c1c1c"/>
  <text x="486" y="280" font-family="sans-serif" font-size="13" fill="#1c1c1c">V = 1 m/s</text>
</svg>
